name: Sync IBKR Trades

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # manual trigger button in GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # The site's /api/ibkr?step=sync endpoint does the whole job server-side
      # (fetch Flex report, parse, dedupe, merge into the store), so this
      # workflow only has to call it and retry while the report generates.
      - name: Trigger server-side IBKR sync
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          ref=""; dl=""
          for attempt in 1 2 3 4; do
            echo "Attempt $attempt"
            resp=$(curl -sS --max-time 90 -G "$SITE_URL/api/ibkr" \
              --data-urlencode "step=sync" \
              ${ref:+--data-urlencode "refCode=$ref"} \
              ${dl:+--data-urlencode "dlUrl=$dl"} \
              || echo '{"error":"request failed"}')
            echo "Response: $resp"
            if echo "$resp" | grep -q '"ok":true'; then
              echo "Sync complete."
              exit 0
            fi
            # Report still generating — continue polling the same reference
            ref=$(echo "$resp" | sed -n 's/.*"refCode":"\([^"]*\)".*/\1/p')
            dl=$(echo  "$resp" | sed -n 's/.*"dlUrl":"\([^"]*\)".*/\1/p')
            sleep 30
          done
          echo "Sync did not complete after 4 attempts"
          exit 1
