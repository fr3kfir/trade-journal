[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/@sparticuz/chromium/bin/**"]

[functions.ibkr]
  timeout = 26

[functions.tax-report]
  timeout = 60

[functions.chart]
  timeout = 15

[functions.tv-screenshot]
  timeout = 26

[functions.chat]
  timeout = 26

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
